name: Windows Cloudflare Tunnel
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP Access
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Download and Start Pinggy TCP Tunnel
        run: |
          Write-Host "Setting up secure TCP tunnel for RDP..."
          # Pinggy ব্যবহার করে সরাসরি TCP পোর্ট ফরোয়ার্ড করা যা RDP-এর জন্য চমৎকার কাজ করে
          ssh -o StrictHostKeyChecking=no -R 0:localhost:3389 free.pinggy.io
